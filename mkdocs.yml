site_name: OpenTLV
site_description: Portable C99 and C++ library for reading, writing and validating TLV data.
site_url: https://marekcingel.github.io/OpenTLV/
repo_url: https://github.com/marekcingel/OpenTLV
repo_name: marekcingel/OpenTLV
edit_uri: edit/develop/docs/

docs_dir: docs
site_dir: site
strict: true

# Anchors are only reported as INFO by default; warn so strict fails on them.
validation:
  links:
    anchors: warn

# docs/README.md is the GitHub index; the site landing page is docs/index.md.
exclude_docs: |
  /README.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.action.edit
    - content.code.copy

# Rewrites relative links that leave docs/ (source files, README, CHANGELOG)
# to GitHub URLs, so the Markdown stays valid on GitHub and in the site.
hooks:
  - tools/docs/hooks.py

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started:
      - Getting started: getting-started.md
      - Compilers and build settings: compilers.md
  - Concepts:
      - Architecture: architecture.md
      - Core types: core-types.md
      - Borrowed values: value.md
      - Logical lengths: length.md
      - Byte order: endian.md
  - Formats:
      - Overview: formats/README.md
      - Default TLV: formats/default/README.md
      - Fixed 1-byte TLV: formats/fixed/README.md
      - BER-TLV: formats/asn1/ber.md
      - DER-TLV: formats/asn1/der.md
      - CER-TLV: formats/asn1/cer.md
      - Custom formats: formats/custom/README.md
      - Format examples: format-examples.md
      - Format roadmap: format-roadmap.md
  - Profiles:
      - DER: profiles/der/README.md
      - CER: profiles/cer/README.md
      - EMV: profiles/emv/README.md
  - Guides:
      - Memory ownership: memory.md
      - Schemas and length validation: schemas.md
      - Value codecs: codecs.md
      - Copy helpers: copy.md
      - Scanning and recovery: scanner.md
  - CLI:
      - otlv command line: cli.md
  - Development:
      - Fuzzing: fuzzing.md
      - Logo assets: assets/README.md
