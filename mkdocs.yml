  - Architecture and Concepts:
      - Architecture: concepts/architecture.md
      - Core types: concepts/core-types.md
      - Borrowed values: concepts/value.md
      - Logical lengths: concepts/length.md
      - Byte order: concepts/endian.md
      - C++ public/native boundary: concepts/cxx-native-boundary.md
      - C++ Format customization: concepts/cxx-formats.md
      - C++ built-in standards: concepts/cxx-builtins.md
  - Development:
      - Runtime model and canonical IR: concepts/runtime-model.md
      - Processing pipeline: concepts/processing-pipeline.md
      - Core architectural rules: concepts/architectural-rules.md
      - Format and Element contract: concepts/format-contract.md
      - Definition boundaries: concepts/definition-boundaries.md
      - Development workflow: development/workflow.md
      - C ABI compatibility: development/abi-compatibility.md
      - Where documentation belongs: development/documentation-layout.md
      - Documentation audit: development/documentation-audit.md
      - Fuzzing: development/fuzzing.md
      - Rust bindings: development/rust.md
      - Python bindings: development/python.md
      - Lua bindings: development/lua.md
      - Go bindings: development/go.md
      - Logo assets: assets/README.md
