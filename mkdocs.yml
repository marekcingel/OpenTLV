site_name: OpenTLV
site_description: Portable TLV processing with a canonical C engine, language APIs, CLI and WebAssembly.
site_url: https://marekcingel.github.io/OpenTLV/
repo_url: https://github.com/marekcingel/OpenTLV
repo_name: marekcingel/OpenTLV
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

# Several checks are only reported as INFO by default; warn so strict fails on
# them: pages missing from nav, absolute links, missing nav files and anchors.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

# docs/README.md is the GitHub index; the site landing page is docs/index.md.
exclude_docs: |
  /README.md

theme:
  name: material
  custom_dir: tools/docs/overrides
  logo: assets/logo-mark.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
    - content.tabs.link

extra:
  # "development" for local and latest builds, "release" for tagged versions;
  # tools/docs/hooks.py reads it from OPENTLV_DOCS_CHANNEL, which the
  # Documentation workflow sets (tools/docs/overrides/main.html).
  docs_channel: development
  # Version selector; versions are published with mike (see CONTRIBUTING.md).
  version:
    provider: mike
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/marekcingel/OpenTLV
      name: OpenTLV on GitHub

# Rewrites relative links that leave docs/ (source files, README, CHANGELOG)
# to GitHub URLs, so the Markdown stays valid on GitHub and in the site.
hooks:
  - tools/docs/hooks.py

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  # C/C++ content tabs (/// tab | C); see docs/development/documentation-layout.md.
  - pymdownx.blocks.tab:
      alternate_style: true

# The playground page (docs/playground/) is only a script and a stylesheet; the
# script does nothing on pages without the playground element.
extra_css:
  - playground/playground.css
extra_javascript:
  - path: playground/playground.js
    type: module

nav:
  - Home: index.md
  - Getting Started:
      - Getting started: getting-started/README.md
      - Understand the basic model: concepts/learning-model.md
  - Guides:
      - Choose a processing API: guides/processing.md
      - Pull-based Reader: guides/reader.md
      - Writer and scoped construction: guides/writer.md
      - Mutable documents: guides/document.md
      - Diagnostics: guides/diagnostics.md
      - Path queries: guides/queries.md
      - Schemas and length validation: guides/schemas.md
      - Value codecs: guides/codecs.md
      - Executable examples: guides/examples.md
      - Memory ownership: guides/memory.md
      - Copy helpers: guides/copy.md
      - Building only the components you need: guides/select-components.md
  - Language APIs:
      - C++ examples: guides/cxx-examples.md
      - Using OpenTLV from Rust: guides/rust.md
      - Using OpenTLV from Python: guides/python.md
      - Using OpenTLV from Lua: guides/lua.md
      - Language bindings: concepts/bindings.md
      - Using OpenTLV from Go: guides/go.md
      - WebAssembly tooling: development/webassembly.md
  - Formats:
      - Overview: formats/README.md
      - Implemented capabilities: formats/support.md
      - Configurable fixed-width TLV: formats/fixed/configurable.md
      - Configurable variable-width TLV: formats/variable.md
      - Bluetooth LTV: formats/bluetooth/README.md
      - NFC Type 2 Tag framing: formats/nfc/README.md
      - DHCPv4 option framing: formats/dhcp/README.md
      - LLDP TLV support: formats/lldp/README.md
      - LLDP reference and conformance notes: formats/lldp/conformance.md
      - BER-TLV: formats/asn1/ber.md
      - DER-TLV: formats/asn1/der.md
      - CER-TLV: formats/asn1/cer.md
      - Custom formats: formats/custom/README.md
      - Format examples: formats/format-examples.md
      - Format roadmap: formats/format-roadmap.md
      - Format candidate catalogue: formats/format-catalogue.md
      - LLDP requirements review: formats/lldp-review.md
  - Standards:
      - DER: standards/der/README.md
      - CER: standards/cer/README.md
      - EMV: standards/emv/README.md
  - CLI:
      - otlv command line: cli/README.md
      - TLV JSON document: cli/json-schema.md
  - Playground:
      - TLV playground: playground/index.md
  - Reference:
      - Overview: reference/README.md
      - C API: reference/c-api.md
      - C++ API: reference/cxx-api.md
      - Compilers and build settings: reference/compilers.md
