name: Bug Report
description: Report a defect, regression, crash, or incorrect parsing/serialization behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search
        [existing issues](https://github.com/marekcingel/OpenTLV/issues) first.

        Report suspected **security vulnerabilities** privately instead, following
        [SECURITY.md](https://github.com/marekcingel/OpenTLV/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: input
    id: opentlv-version
    attributes:
      label: OpenTLV version
      description: Release tag, commit hash, or branch.
      placeholder: e.g. v0.4.0 or commit 7b3ff9d
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler and version
      placeholder: e.g. Clang 18.1.0, GCC 13.2, MSVC 19.40
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04, Windows 11, macOS 14
    validations:
      required: true
  - type: input
    id: build-options
    attributes:
      label: Build options
      description: Relevant CMake options or configuration flags, if any.
      placeholder: e.g. OPENTLV_PROFILE_EMV=ON, Debug build
    validations:
      required: false
  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps needed to reproduce the behavior.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: repro-input
    attributes:
      label: Input data or minimal example
      description: A minimal reproducer - input bytes (hex), a small code snippet, or both.
      render: text
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, return codes, or a stack trace if applicable.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else relevant (logs, related issues, environment quirks).
    validations:
      required: false
