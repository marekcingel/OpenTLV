name: Valgrind Memcheck

on:
  pull_request:
    paths: ['tlv/**', 'tlv\+\+/**', 'tests/**', 'scripts/*memcheck*', 'CMakeLists.txt', 'cmake/**', '.github/workflows/valgrind.yml']
  push:
    branches: [main]
    paths: ['tlv/**', 'tlv\+\+/**', 'tests/**', 'scripts/*memcheck*', 'CMakeLists.txt', 'cmake/**', '.github/workflows/valgrind.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc g++ cmake ninja-build valgrind python3
      - name: Configure plain GCC Debug build
        run: >-
          cmake -S . -B build/valgrind -G Ninja
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_STANDARD=11 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF
          -DOPENTLV_BUILD_MEMCHECK=ON -DOPENTLV_BUILD_TESTS=ON
          -DOPENTLV_BUILD_EXAMPLES=OFF -DOPENTLV_BUILD_CLI=OFF
          -DOPENTLV_BUILD_CLI_TESTS=OFF -DOPENTLV_BUILD_PROPERTY_TESTS=OFF
          -DOPENTLV_BUILD_FUZZING=OFF
      - name: Build C and C++ suites
        run: cmake --build build/valgrind --parallel 2
      - name: Run tests and launcher regressions without instrumentation
        run: ctest --test-dir build/valgrind --output-on-failure --no-tests=error --parallel 2
      - name: Run Memcheck
        run: ctest --test-dir build/valgrind -T memcheck -LE no-memcheck --output-on-failure --no-tests=error --parallel 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valgrind-${{ github.sha }}
          path: build/valgrind/Testing/
          if-no-files-found: warn
