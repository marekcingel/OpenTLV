name: Clang Build

on:
  push:
    branches: [main, develop]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  clang:
    name: Clang 18 / ${{ matrix.build_type }} / C++${{ matrix.cxx_standard }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            cxx_standard: 23
          - build_type: Release
            cxx_standard: 23
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang-18 ninja-build

      - name: Install coverage tools
        if: matrix.build_type == 'Debug' && matrix.cxx_standard == 23
        run: |
          sudo apt-get install -y llvm-18 python3-venv
          python3 -m venv "$RUNNER_TEMP/coverage-venv"
          "$RUNNER_TEMP/coverage-venv/bin/pip" install gcovr==8.4
          echo "$RUNNER_TEMP/coverage-venv/bin" >> "$GITHUB_PATH"

      - name: Configure CMake
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_STANDARD=99 -DCMAKE_C_STANDARD_REQUIRED=ON -DCMAKE_C_EXTENSIONS=OFF
          -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}
          -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF
          -DOPENTLV_WARNINGS_AS_ERRORS=ON
          -DOPENTLV_BUILD_TESTS=ON -DOPENTLV_BUILD_EXAMPLES=ON
          -DOPENTLV_BUILD_BENCHMARKS=ON
          ${{ matrix.build_type == 'Debug' && matrix.cxx_standard == 23 && '-DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage -DCMAKE_SHARED_LINKER_FLAGS=--coverage' || '' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Reset coverage counters before unit tests
        if: matrix.build_type == 'Debug' && matrix.cxx_standard == 23
        # GoogleTest discovery can execute instrumented binaries during the build.
        run: find build -type f -name '*.gcda' -delete

      - name: Run all unit tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Generate unit-test coverage report
        if: matrix.build_type == 'Debug' && matrix.cxx_standard == 23
        # Collect before examples run and search only the main build tree.
        run: |
          test -n "$(find build -type f -name '*.gcno' -print -quit)" || { echo '::error::Missing coverage instrumentation data'; exit 1; }
          test -n "$(find build/tests -type f -name '*.gcda' -print -quit)" || { echo '::error::Missing unit-test coverage execution data'; exit 1; }
          mkdir -p coverage
          gcovr build --root . \
            --gcov-executable 'llvm-cov-18 gcov' \
            --filter 'tlv/(src|include)/.*\.(c|h)$' \
            --filter 'tlv\+\+/include/.*\.(h|hpp)$' \
            --include 'tlv/(src|include)/.*\.(c|h)$' \
            --include 'tlv\+\+/include/.*\.(h|hpp)$' \
            --html-details coverage/index.html \
            --json-summary coverage/summary.json \
            --print-summary

      - name: Upload coverage report
        id: coverage-artifact
        if: matrix.build_type == 'Debug' && matrix.cxx_standard == 23
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clang-debug
          path: coverage/
          if-no-files-found: error

      - name: Summarize coverage
        if: matrix.build_type == 'Debug' && matrix.cxx_standard == 23
        env:
          COVERAGE_ARTIFACT_URL: ${{ steps.coverage-artifact.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import json
          import os

          with open('coverage/summary.json', encoding='utf-8') as report:
              data = json.load(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Clang Debug unit-test coverage\n\n')
              summary.write('| Metric | Coverage | Covered / Total |\n| --- | ---: | ---: |\n')
              for label, metric in [('Lines', 'line'), ('Branches', 'branch')]:
                  summary.write(f"| {label} | {data[metric + '_percent']}% | {data[metric + '_covered']} / {data[metric + '_total']} |\n")
              summary.write(f"\n[Download HTML report]({os.environ['COVERAGE_ARTIFACT_URL']})\n")
          PY

      - name: Run C and C++ examples
        run: |
          ./build/examples/tlv/example-tlv
          ./build/examples/tlv++/example-tlv++

      - name: Verify C-only build
        run: |
          cmake -S . -B build-c -G Ninja -DCMAKE_C_COMPILER=clang-18 -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_C_STANDARD=99 -DCMAKE_C_STANDARD_REQUIRED=ON -DCMAKE_C_EXTENSIONS=OFF -DOPENTLV_BUILD_CXX=OFF -DOPENTLV_BUILD_TESTS=OFF -DOPENTLV_BUILD_EXAMPLES=ON -DOPENTLV_BUILD_BENCHMARKS=OFF -DOPENTLV_WARNINGS_AS_ERRORS=ON
          cmake --build build-c --parallel
          ./build-c/examples/tlv/example-tlv

      - name: Set up Python for package verification
        if: github.ref_type == 'tag' && matrix.build_type == 'Release'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and verify distribution archive
        if: github.ref_type == 'tag' && matrix.build_type == 'Release'
        run: python scripts/check_package.py build --cxx ON

      - name: Upload distribution archive
        if: github.ref_type == 'tag' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: OpenTLV-Linux-Clang-${{ github.ref_name }}
          path: build/packages/*.tar.gz
          if-no-files-found: error
