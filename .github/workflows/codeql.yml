name: CodeQL

# Required for pull requests by the repository rules, so it has no path filter:
# a skipped run would leave the required check pending. It runs in parallel with
# the Clang build, so it only lengthens pull request feedback if it is slower.
on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]
  schedule:
    # Re-runs the security-extended query suite against unchanged code every
    # Monday, so newly published queries still get applied between pushes.
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL / C++
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Clang and Ninja
        run: sudo apt-get update && sudo apt-get install -y clang-18 ninja-build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          # Pull requests leave this empty (the default suite) to stay fast; main, tags and the
          # weekly run use the broader security-extended suite.
          queries: ${{ github.event_name != 'pull_request' && 'security-extended' || '' }}

      # A real build is required so CodeQL can trace the exact compiler
      # invocations; unlike the cppcheck/clang-tidy jobs in static-analysis.yml
      # this can't stop at `cmake` configure. Mirrors build-clang.yml's
      # Debug/C++23 configuration, minus the coverage, fuzzing and example-run
      # steps, which don't add anything to the CodeQL database.
      - name: Configure CMake
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_STANDARD=99 -DCMAKE_C_STANDARD_REQUIRED=ON -DCMAKE_C_EXTENSIONS=OFF
          -DCMAKE_CXX_STANDARD=23 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF
          -DOPENTLV_WARNINGS_AS_ERRORS=ON
          -DOPENTLV_BUILD_TESTS=ON
          -DOPENTLV_BUILD_EXAMPLES=${{ github.event_name == 'pull_request' && 'OFF' || 'ON' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:cpp
