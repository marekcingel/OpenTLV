name: GCC Build

on:
  push:
    branches: [main, develop]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main, develop]

jobs:
  test-selection:
    name: Independent ${{ matrix.group }} tests / ${{ matrix.components }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [unit, integration]
        components: [full, minimal]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure selected group
        shell: bash
        run: |
          options=(-DOPENTLV_BUILD_UNIT_TESTS=OFF -DOPENTLV_BUILD_INTEGRATION_TESTS=OFF)
          if [[ '${{ matrix.group }}' == unit ]]; then
            options+=(-DOPENTLV_BUILD_UNIT_TESTS=ON)
          else
            options+=(-DOPENTLV_BUILD_INTEGRATION_TESTS=ON)
          fi
          if [[ '${{ matrix.components }}' == minimal ]]; then
            options+=(-DOPENTLV_FORMAT_DEFAULT=OFF -DOPENTLV_FORMAT_FIXED_1BYTE=OFF
                      -DOPENTLV_FORMAT_BER=OFF -DOPENTLV_FORMAT_DER=OFF
                      -DOPENTLV_PROFILE_EMV=OFF -DOPENTLV_BUILD_CXX=OFF)
          fi
          cmake -S . -B build-selection -DCMAKE_BUILD_TYPE=Release \
            -DOPENTLV_BUILD_TESTS=ON -DOPENTLV_BUILD_EXAMPLES=OFF "${options[@]}"
      - name: Build selected group
        run: cmake --build build-selection --parallel
      - name: Run all enabled tests
        run: ctest --test-dir build-selection --output-on-failure --no-tests=error

  gcc:
    permissions:
      contents: write
    name: GCC / ${{ matrix.build_type }} / C++${{ matrix.cxx_standard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            cxx_standard: 11
          - build_type: Release
            cxx_standard: 23

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure CMake
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}
          -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF
          -DOPENTLV_BUILD_TESTS=ON -DOPENTLV_BUILD_EXAMPLES=ON
          -DOPENTLV_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit and integration tests
        run: |
          ctest --test-dir build -L unit --output-on-failure --no-tests=error
          ctest --test-dir build -L integration --output-on-failure --no-tests=error

      - name: Set up Python for package verification
        if: github.ref_type == 'tag' && matrix.build_type == 'Release'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and verify distribution archive
        if: github.ref_type == 'tag' && matrix.build_type == 'Release'
        run: python scripts/check_package.py build --cxx ON

      - name: Upload distribution archive
        if: github.ref_type == 'tag' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: OpenTLV-Linux-GNU-${{ github.ref_name }}
          path: build/packages/*.tar.gz
          if-no-files-found: error

      - name: Attach archive to GitHub Release
        if: github.ref_type == 'tag' && matrix.build_type == 'Release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            options=(--verify-tag --title "$RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              options+=(--prerelease)
            fi
            # Another compiler job may create the release concurrently.
            gh release create "$RELEASE_TAG" "${options[@]}" ||
              gh release view "$RELEASE_TAG" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" build/packages/*.tar.gz --clobber
