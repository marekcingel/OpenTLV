name: GCC Build

on:
  push:
    branches: [main, develop]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main, develop]

jobs:
  gcc:
    name: GCC / ${{ matrix.build_type }} / C++${{ matrix.cxx_standard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            cxx_standard: 11
          - build_type: Release
            cxx_standard: 23

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure CMake
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}
          -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF
          -DOPENTLV_BUILD_TESTS=ON -DOPENTLV_BUILD_EXAMPLES=ON
          -DOPENTLV_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Set up Python for package verification
        if: github.ref_type == 'tag' && matrix.build_type == 'Release'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and verify distribution archive
        if: github.ref_type == 'tag' && matrix.build_type == 'Release'
        run: python scripts/check_package.py build --cxx ON

      - name: Upload distribution archive
        if: github.ref_type == 'tag' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: OpenTLV-Linux-GNU-${{ github.ref_name }}
          path: build/packages/*.tar.gz
          if-no-files-found: error
