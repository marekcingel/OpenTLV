# Fuzz seeds and other binary fixtures can look like text to the hooks below
# (identify sniffs content, not .gitattributes), so trailing-whitespace and
# end-of-file-fixer can silently corrupt them by adding/removing bytes.
# Exclude the same paths .gitattributes marks `binary`.
exclude: ^(tests/fuzz/(.*/)?corpus/|tools/cli/.*\.bin$)

repos:
  - repo: local
    hooks:
      - id: license-headers
        name: Check SPDX license headers
        entry: python scripts/check_license_headers.py
        language: python
        pass_filenames: false
        always_run: true
      - id: license-header-tests
        name: Test SPDX license policy
        entry: python scripts/test_license_headers.py
        language: python
        files: ^scripts/(check_license_headers|test_license_headers)\.py$
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.1
    hooks:
      - id: clang-format
        args: [-i]
        types_or: [c, c++]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: [--fix, --config, .markdownlint.json]
